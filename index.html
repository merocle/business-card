<style>
:root{--bg:#0d0f12;--card:#15181d;--line:#262a31;--text:#e8eaed;--muted:#9aa0a8;--accent:#d8831b}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:56px 20px 40px;background:radial-gradient(600px 300px at 50% 0,rgba(216,131,27,.10),transparent 70%)}
main{width:100%;max-width:520px}
header{text-align:center;margin-bottom:36px}
.avatar{width:120px;height:120px;border-radius:50%;object-fit:cover;display:block;margin:0 auto 18px;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
h1{font-size:1.75rem;line-height:1.2;letter-spacing:-.01em}
header p{color:var(--muted);margin-top:6px}
ul{list-style:none;padding:0;display:grid;gap:12px}
a{color:inherit;text-decoration:none}
.link{display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;transition:border-color .15s,transform .15s}
.link:hover,.link:focus-visible{border-color:var(--accent);transform:translateY(-1px)}
.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link span{flex:1;min-width:0}
.link b{display:block;font-weight:600}
.link small{display:block;color:var(--muted);font-size:.875rem;margin-top:2px}
.link svg{flex:none;width:18px;height:18px;color:var(--muted);transition:color .15s,transform .15s}
.link:hover svg{color:var(--accent);transform:translateX(2px)}
footer{margin-top:auto;padding-top:48px;color:var(--muted);font-size:.8125rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <img class="avatar" src="img/avatar.jpg" width="120" height="120" alt="Ivan Kuleshov">
    <h1>Ivan Kuleshov</h1>

  </header>

  <!-- Links: copy an <li> block to add one -->

    <li><a class="link" rel="me" href="https://x.com/Merocle"><span><b>X</b><small>Formerly Twitter</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></li>
    <li><a class="link" href="https://www.instagram.com/uptime.lab/"><span><b>Instagram</b><small>@uptime.lab</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></li>
    <li><a class="link" href="mailto:merocle@gmail.com"><span><b>Email</b><small>merocle@gmail.com</small></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a></li>

</main>
